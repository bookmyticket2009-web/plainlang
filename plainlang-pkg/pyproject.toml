[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plainlang"
version = "4.0.0"
description = "Zero-syntax plain-English programming language and interactive studio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Prasheel Shah" }
]
keywords = ["plainlang", "programming-language", "interpreter", "ide", "tkinter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Interpreters"
]

[project.scripts]
plainlang = "plainlang.cli:main"
plainlang-studio = "plainlang.cli:launch_studio"
jarvis = "plainlang.env_jarvis:jarvis_main"

[tool.setuptools.packages.find]
where = ["src"]